<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>圣诞快乐</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* 标题 */
        #main-title {
            position: absolute;
            top: 35vh;
            left: 50%;
            transform: translateX(-50%) scale(0.3);
            opacity: 0;
            margin: 0;
            font-family: 'Parisienne', cursive; 
            font-size: 6rem;
            color: #d4af37; 
            letter-spacing: 1rem;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.8), 0 0 60px rgba(212, 175, 55, 0.4), 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 20;
            pointer-events: none; 
            white-space: nowrap;
            transition: all 1.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #main-title.visible { opacity: 1; transform: translateX(-50%) scale(1); }

        /* UI 面板 */
        #ui-panel {
            position: absolute;
            top: 20px; right: 20px; width: 220px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px; border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        h2 { margin: 0 0 5px 0; font-size: 18px; color: #d4af37; text-transform: uppercase; letter-spacing: 1px; }
        .status-indicator { display: flex; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        #hand-status { font-weight: bold; margin-left: 10px; font-size: 14px; color: #d4af37; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #d4af37; transition: background 0.3s; }
        .dot.active { background: #00ff00; box-shadow: 0 0 10px #00ff00; }
        .dot.scatter { background: #ff4d4d; box-shadow: 0 0 10px #ff4d4d; }

        /* 视频 */
        #input_video {
            position: absolute; bottom: 20px; left: 20px;
            width: 160px; height: 120px; border-radius: 8px;
            z-index: 10; opacity: 0.7; transform: scaleX(-1); border: 2px solid #333;
        }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #d4af37; font-size: 24px; z-index: 100; pointer-events: none;
            width: 100%; text-align: center;
        }

        @media screen and (max-width: 768px) {
            #main-title { font-size: 12vw; padding: 0 10px; width: 100%; text-align: center; box-sizing: border-box; }
            #input_video { display: none; }
            #ui-panel { top: 15px; right: 15px; width: 160px; padding: 12px; }
            h2 { font-size: 12px; } #hand-status { font-size: 10px; } #ui-panel p { font-size: 10px !important; }
        }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>

    <div id="loading">正在初始化...<br><span style="font-size:14px; opacity:0.7">请允许摄像头权限</span></div>
    <h1 id="main-title">Merry Christmas</h1>
    <video id="input_video" playsinline></video>
    <div id="ui-panel">
        <h2>🎄 控制面板</h2>
        <div class="status-indicator">
            <div id="status-dot" class="dot"></div>
            <span id="hand-status">状态：显示圣诞树</span>
        </div>
        <p style="font-size: 11px; color: #ddd; margin-top: 15px; line-height: 1.6;">
            手势控制：<br>✊ 握拳 = 聚合<br>🖐 张手 = 悬浮
        </p>
    </div>
    <div id="canvas-container"></div>

<script>
    // --- 1. 初始化 ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.002);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 30; camera.position.y = 5;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // --- 💡 灯光调整 (调暗) ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2); // 0.4 -> 0.2
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffd700, 0.5); // 0.8 -> 0.5
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);
    const pointLight = new THREE.PointLight(0xff0000, 0.3, 50); // 0.5 -> 0.3
    pointLight.position.set(-10, 10, -10);
    scene.add(pointLight);

    // --- 2. 粒子系统 ---
    // 树叶
    const foliageCount = 12000; 
    const foliageGeo = new THREE.BufferGeometry();
    const foliagePos = new Float32Array(foliageCount * 3);
    const foliageCols = new Float32Array(foliageCount * 3);
    const foliageTarget = new Float32Array(foliageCount * 3); 
    const foliageRandom = new Float32Array(foliageCount * 3); 
    const foliagePalette = [ new THREE.Color("#0f5c34"), new THREE.Color("#0f5c34"), new THREE.Color("#146b3a"), new THREE.Color("#0a4a2a"), new THREE.Color("#ffffff") ];

    for (let i = 0; i < foliageCount; i++) {
        for(let j = 0; j < 3; j++) { foliagePos[i*3+j] = (Math.random()-0.5)*100; foliageRandom[i*3+j] = (Math.random()-0.5)*60; }
        const color = foliagePalette[Math.floor(Math.random() * foliagePalette.length)];
        foliageCols[i*3] = color.r; foliageCols[i*3+1] = color.g; foliageCols[i*3+2] = color.b;
        const h = Math.random() * 20; 
        const radius = (20 - h) * 0.4 * Math.random(); 
        const angle = Math.random() * Math.PI * 2;
        foliageTarget[i*3] = Math.cos(angle)*radius; foliageTarget[i*3+1] = h-10; foliageTarget[i*3+2] = Math.sin(angle)*radius;
    }
    foliageGeo.setAttribute('position', new THREE.BufferAttribute(foliagePos, 3));
    foliageGeo.setAttribute('color', new THREE.BufferAttribute(foliageCols, 3));
    const foliageMaterial = new THREE.PointsMaterial({
        size: 0.12, vertexColors: true, blending: THREE.AdditiveBlending,
        depthWrite: false, transparent: true, 
        opacity: 0.45 // 调低透明度，让树暗一点 (0.6 -> 0.45)
    });
    const foliageParticles = new THREE.Points(foliageGeo, foliageMaterial);
    scene.add(foliageParticles);

    // 装饰
    const ornamentCount = 800; 
    const ornamentGeo = new THREE.BufferGeometry();
    const ornamentPos = new Float32Array(ornamentCount * 3);
    const ornamentCols = new Float32Array(ornamentCount * 3);
    const ornamentTarget = new Float32Array(ornamentCount * 3); 
    const ornamentRandom = new Float32Array(ornamentCount * 3); 
    const ornamentPalette = [ new THREE.Color("#d4af37"), new THREE.Color("#c41e3a") ];

    for (let i = 0; i < ornamentCount; i++) {
        for(let j = 0; j < 3; j++) { ornamentPos[i*3+j] = (Math.random()-0.5)*100; ornamentRandom[i*3+j] = (Math.random()-0.5)*70; }
        const color = ornamentPalette[Math.floor(Math.random() * ornamentPalette.length)];
        ornamentCols[i*3] = color.r; ornamentCols[i*3+1] = color.g; ornamentCols[i*3+2] = color.b;
        const h = Math.random() * 20; 
        const radius = (20 - h) * 0.4 * (0.9 + Math.random()*0.1); 
        const angle = Math.random() * Math.PI * 2;
        ornamentTarget[i*3] = Math.cos(angle)*radius; ornamentTarget[i*3+1] = h-10; ornamentTarget[i*3+2] = Math.sin(angle)*radius;
    }
    ornamentGeo.setAttribute('position', new THREE.BufferAttribute(ornamentPos, 3));
    ornamentGeo.setAttribute('color', new THREE.BufferAttribute(ornamentCols, 3));
    const ornamentParticles = new THREE.Points(ornamentGeo, new THREE.PointsMaterial({
        size: 0.28, vertexColors: true, blending: THREE.AdditiveBlending,
        depthWrite: false, transparent: true, opacity: 0.9 
    }));
    scene.add(ornamentParticles);

    // 星星
    const starShape = new THREE.Shape();
    const outerRadius = 0.3; const innerRadius = 0.15; const points = 5; 
    for (let i = 0; i < points * 2; i++) {
        const radius = i % 2 === 0 ? outerRadius : innerRadius;
        const angle = (i / (points * 2)) * Math.PI * 2 + Math.PI / 2;
        const x = Math.cos(angle) * radius; const y = Math.sin(angle) * radius;
        if (i === 0) starShape.moveTo(x, y); else starShape.lineTo(x, y);
    }
    starShape.closePath();
    const starGeometry = new THREE.ExtrudeGeometry(starShape, { steps: 1, depth: 0.1, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 3 });
    starGeometry.center(); 
    const starGroup = new THREE.Mesh(starGeometry, new THREE.MeshBasicMaterial({ color: 0xffd700 }));
    const starBasePosition = new THREE.Vector3(0, 10, 0);
    const starScatterVector = new THREE.Vector3((Math.random()-0.5)*30, Math.random()*30+20, (Math.random()-0.5)*30);
    starGroup.position.copy(starBasePosition);
    scene.add(starGroup);

    // 地面
    const gridHelper = new THREE.GridHelper(100, 40, 0x444444, 0x111111); 
    gridHelper.position.y = -10; 
    gridHelper.material.opacity = 0.2; gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // --- 🎁 礼物系统 (带精美蝴蝶结) ---
    const gifts = []; 
    const giftGroup = new THREE.Group();
    scene.add(giftGroup);
    const boxPalette = [0xcc231e, 0x0f5c34, 0x1a468c, 0xffffff]; 
    const ribbonMaterial = new THREE.MeshPhongMaterial({ color: 0xffd700, shininess: 100 }); 

    for(let i=0; i<12; i++) {
        const w = 1.0 + Math.random() * 0.8;
        const h = 0.8 + Math.random() * 0.6;
        const d = 1.0 + Math.random() * 0.8;
        
        // 盒子
        const boxGeo = new THREE.BoxGeometry(w, h, d);
        const boxMat = new THREE.MeshPhongMaterial({ color: boxPalette[Math.floor(Math.random()*boxPalette.length)], shininess: 30 });
        const mesh = new THREE.Mesh(boxGeo, boxMat);

        // 丝带 (十字)
        const rbW = w * 0.15;
        const rib1 = new THREE.Mesh(new THREE.BoxGeometry(rbW, h+0.01, d+0.01), ribbonMaterial);
        const rib2 = new THREE.Mesh(new THREE.BoxGeometry(w+0.01, h+0.01, rbW), ribbonMaterial);
        mesh.add(rib1); mesh.add(rib2);

        // 🎀 精美蝴蝶结 (Torus圆环)
        const bowRadius = w * 0.25;
        const bowTube = w * 0.05;
        // 左环
        const bow1Geo = new THREE.TorusGeometry(bowRadius, bowTube, 8, 16, Math.PI * 1.6);
        const bow1 = new THREE.Mesh(bow1Geo, ribbonMaterial);
        bow1.position.set(-bowRadius*0.8, h/2 + bowRadius*0.8, 0);
        bow1.rotation.set(0, 0, Math.PI/4); // 倾斜
        mesh.add(bow1);
        // 右环
        const bow2Geo = new THREE.TorusGeometry(bowRadius, bowTube, 8, 16, Math.PI * 1.6);
        const bow2 = new THREE.Mesh(bow2Geo, ribbonMaterial);
        bow2.position.set(bowRadius*0.8, h/2 + bowRadius*0.8, 0);
        bow2.rotation.set(0, Math.PI, -Math.PI/4); // 镜像倾斜
        mesh.add(bow2);
        // 中间结
        const knot = new THREE.Mesh(new THREE.CylinderGeometry(bowTube*1.2, bowTube*1.2, rbW*1.2, 8), ribbonMaterial);
        knot.position.set(0, h/2, 0);
        knot.rotation.z = Math.PI/2;
        mesh.add(knot);

        // 位置
        const angle = Math.random() * Math.PI * 2;
        const radius = 5 + Math.random() * 6;
        const homePos = new THREE.Vector3(Math.cos(angle)*radius, -10 + h/2, Math.sin(angle)*radius);
        const targetPos = new THREE.Vector3((Math.random()-0.5)*60, (Math.random()*25)-5, (Math.random()-0.5)*40);

        mesh.position.copy(homePos);
        mesh.rotation.y = Math.random() * Math.PI;
        giftGroup.add(mesh);
        
        gifts.push({ mesh: mesh, home: homePos, target: targetPos, initialRot: mesh.rotation.clone() });
    }

    // --- 3. 交互 ---
    let gestureState = 'GATHER'; 
    let explosionFactor = 0; 
    const videoElement = document.getElementById('input_video');
    const handStatus = document.getElementById('hand-status');
    const statusDot = document.getElementById('status-dot');
    const mainTitle = document.getElementById('main-title');

    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    hands.onResults(onResults);
    const cameraUtils = new Camera(videoElement, { onFrame: async () => { await hands.send({image: videoElement}); }, width: 320, height: 240 });
    cameraUtils.start();

    function onResults(results) {
        document.getElementById('loading').style.display = 'none';
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const landmarks = results.multiHandLandmarks[0];
            const wrist = landmarks[0];
            const tips = [8, 12, 16, 20]; const mcps = [5, 9, 13, 17]; 
            let foldedFingers = 0;
            function dist(p1, p2) { return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2)); }
            for(let i=0; i<4; i++) { if (dist(landmarks[tips[i]], wrist) < dist(landmarks[mcps[i]], wrist) * 1.6) foldedFingers++; }
            if (foldedFingers >= 3) {
                gestureState = 'GATHER';
                statusDot.classList.add('active'); statusDot.classList.remove('scatter');
                handStatus.innerText = "状态: ✊ 聚合"; handStatus.style.color = "#00ff00";
                mainTitle.classList.remove('visible');
            } else {
                gestureState = 'SCATTER';
                statusDot.classList.add('scatter'); statusDot.classList.remove('active');
                handStatus.innerText = "状态: 🖐 悬浮"; handStatus.style.color = "#ff4d4d";
                mainTitle.classList.add('visible');
            }
        } else {
            gestureState = 'GATHER'; 
            statusDot.classList.remove('active', 'scatter');
            handStatus.innerText = "默认状态"; handStatus.style.color = "#d4af37";
            mainTitle.classList.remove('visible');
        }
    }

    // --- 4. 动画 ---
    let time = 0;
    function updateParticles(geometry, count, currentPos, targetPos, randomPos, factor, timeOffset) {
        for (let i = 0; i < count; i++) {
            const ix = i * 3; const iy = i * 3 + 1; const iz = i * 3 + 2;
            const finalX = targetPos[ix] + (randomPos[ix] * factor);
            const finalY = targetPos[iy] + (randomPos[iy] * factor);
            const finalZ = targetPos[iz] + (randomPos[iz] * factor);
            currentPos[ix] += (finalX - currentPos[ix]) * 0.08;
            currentPos[iy] += (finalY - currentPos[iy]) * 0.08;
            currentPos[iz] += (finalZ - currentPos[iz]) * 0.08;
            if (factor < 0.1) currentPos[iy] += Math.sin(time + ix * timeOffset) * 0.02;
        }
        geometry.attributes.position.needsUpdate = true;
    }

    function animate() {
        requestAnimationFrame(animate);
        time += 0.01;
        const slowRot = time * 0.1;
        foliageParticles.rotation.y = slowRot;
        ornamentParticles.rotation.y = slowRot; 
        starGroup.rotation.y = time * 0.8;
        
        let targetFactor = (gestureState === 'SCATTER') ? 1 : 0;
        explosionFactor += (targetFactor - explosionFactor) * 0.05;

        updateParticles(foliageGeo, foliageCount, foliagePos, foliageTarget, foliageRandom, explosionFactor, 0.01);
        updateParticles(ornamentGeo, ornamentCount, ornamentPos, ornamentTarget, ornamentRandom, explosionFactor, 0.02);

        const starCurrentTarget = starBasePosition.clone().lerp(starBasePosition.clone().add(starScatterVector), explosionFactor);
        starGroup.position.lerp(starCurrentTarget, 0.08);
        const currentScale = 1.0 * (1 - explosionFactor * 0.3);
        starGroup.scale.set(currentScale, currentScale, currentScale);

        // 礼物盒
        giftGroup.rotation.y = (explosionFactor < 0.5) ? slowRot : giftGroup.rotation.y;
        gifts.forEach(gift => {
            // 位置插值
            gift.mesh.position.lerpVectors(gift.home, gift.target, explosionFactor);
            // 🚫 删除了旋转代码，保持稳定悬浮
            if(explosionFactor < 0.1) {
                // 聚合时慢慢回正跟随
                gift.mesh.rotation.x = 0;
                gift.mesh.rotation.z = 0;
            }
        });

        renderer.render(scene, camera);
    }

    let mouseX = 0; let mouseY = 0;
    document.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX - window.innerWidth / 2) * 0.01;
        mouseY = (e.clientY - window.innerHeight / 2) * 0.01;
        camera.position.x += (mouseX - camera.position.x) * 0.05;
        camera.position.y += (-mouseY + 5 - camera.position.y) * 0.05;
        camera.lookAt(0, 0, 0);
    });
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    animate();
</script>
</body>
</html>
