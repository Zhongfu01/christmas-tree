<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>圣诞快乐</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* 标题 */
        #main-title {
            position: absolute;
            top: 35vh;
            left: 50%;
            transform: translateX(-50%) scale(0.3);
            opacity: 0;
            margin: 0;
            font-family: 'Parisienne', cursive; 
            font-size: 6rem;
            color: #d4af37; 
            letter-spacing: 1rem;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.8), 0 0 60px rgba(212, 175, 55, 0.4), 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 20;
            pointer-events: none; 
            white-space: nowrap;
            transition: all 1.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #main-title.visible { opacity: 1; transform: translateX(-50%) scale(1); }

        /* UI 面板 */
        #ui-panel {
            position: absolute;
            top: 20px; right: 20px; width: 220px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px; border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        h2 { margin: 0 0 5px 0; font-size: 18px; color: #d4af37; text-transform: uppercase; letter-spacing: 1px; }
        .status-indicator { display: flex; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        #hand-status { font-weight: bold; margin-left: 10px; font-size: 14px; color: #d4af37; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #d4af37; transition: background 0.3s; }
        .dot.active { background: #00ff00; box-shadow: 0 0 10px #00ff00; }
        .dot.scatter { background: #ff4d4d; box-shadow: 0 0 10px #ff4d4d; }

        /* 视频 */
        #input_video {
            position: absolute; bottom: 20px; left: 20px;
            width: 160px; height: 120px; border-radius: 8px;
            z-index: 10; opacity: 0.7; transform: scaleX(-1); border: 2px solid #333;
        }
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #d4af37; font-size: 24px; z-index: 100; pointer-events: none;
            width: 100%; text-align: center;
        }

        /* 手机适配 */
        @media screen and (max-width: 768px) {
            #main-title { font-size: 9vw; letter-spacing: 0.2rem; padding: 0 10px; width: 100%; text-align: center; box-sizing: border-box; }
            #input_video { display: none; }
            #ui-panel { top: 15px; right: 15px; width: 160px; padding: 12px; }
            h2 { font-size: 12px; } #hand-status { font-size: 10px; } #ui-panel p { font-size: 10px !important; }
        }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>

    <div id="loading">正在初始化...<br><span style="font-size:14px; opacity:0.7">请允许摄像头权限</span></div>
    <h1 id="main-title">Merry Christmas</h1>
    <video id="input_video" playsinline></video>
    <div id="ui-panel">
        <h2>🎄 控制面板</h2>
        <div class="status-indicator">
            <div id="status-dot" class="dot"></div>
            <span id="hand-status">状态：显示圣诞树</span>
        </div>
        <p style="font-size: 11px; color: #ddd; margin-top: 15px; line-height: 1.6;">
            手势控制：<br>✊ 握拳 = 聚合<br>🖐 张手 = 悬浮
        </p>
    </div>
    <div id="canvas-container"></div>

<script>
    // --- 1. 初始化 ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.002);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 30; camera.position.y = 0;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const isMobile = window.innerWidth < 768;

    // --- 2. 粒子系统 ---
    // 树叶
    const foliageCount = 16000; 
    const foliageGeo = new THREE.BufferGeometry();
    const foliagePos = new Float32Array(foliageCount * 3);
    const foliageCols = new Float32Array(foliageCount * 3);
    const foliageTarget = new Float32Array(foliageCount * 3); 
    const foliageRandom = new Float32Array(foliageCount * 3); 
    const foliagePalette = [ new THREE.Color("#0f5c34"), new THREE.Color("#0f5c34"), new THREE.Color("#146b3a"), new THREE.Color("#0a4a2a"), new THREE.Color("#1a5e20") ];

    for (let i = 0; i < foliageCount; i++) {
        for(let j = 0; j < 3; j++) { foliagePos[i*3+j] = (Math.random()-0.5)*100; foliageRandom[i*3+j] = (Math.random()-0.5)*60; }
        const color = foliagePalette[Math.floor(Math.random() * foliagePalette.length)];
        foliageCols[i*3] = color.r; foliageCols[i*3+1] = color.g; foliageCols[i*3+2] = color.b;
        
        const h = Math.random() * 20; 
        if (h > 18.5 && Math.random() > 0.5) { i--; continue; }
        const maxRadius = (20 - h) * 0.4;
        const radius = maxRadius * (Math.random() * 0.9 + 0.1); 

        const angle = Math.random() * Math.PI * 2;
        foliageTarget[i*3] = Math.cos(angle)*radius; foliageTarget[i*3+1] = h-10; foliageTarget[i*3+2] = Math.sin(angle)*radius;
    }
    foliageGeo.setAttribute('position', new THREE.BufferAttribute(foliagePos, 3));
    foliageGeo.setAttribute('color', new THREE.BufferAttribute(foliageCols, 3));
    const foliageMaterial = new THREE.PointsMaterial({
        size: 0.12, vertexColors: true, blending: THREE.AdditiveBlending,
        depthWrite: false, transparent: true, opacity: 0.25 
    });
    const foliageParticles = new THREE.Points(foliageGeo, foliageMaterial);
    scene.add(foliageParticles);

    // 装饰
    const ornamentCount = 800; 
    const ornamentGeo = new THREE.BufferGeometry();
    const ornamentPos = new Float32Array(ornamentCount * 3);
    const ornamentCols = new Float32Array(ornamentCount * 3);
    const ornamentTarget = new Float32Array(ornamentCount * 3); 
    const ornamentRandom = new Float32Array(ornamentCount * 3); 
    const ornamentPalette = [ new THREE.Color("#d4af37"), new THREE.Color("#c41e3a") ];

    for (let i = 0; i < ornamentCount; i++) {
        for(let j = 0; j < 3; j++) { ornamentPos[i*3+j] = (Math.random()-0.5)*100; ornamentRandom[i*3+j] = (Math.random()-0.5)*70; }
        const color = ornamentPalette[Math.floor(Math.random() * ornamentPalette.length)];
        ornamentCols[i*3] = color.r; ornamentCols[i*3+1] = color.g; ornamentCols[i*3+2] = color.b;
        const h = Math.random() * 20; 
        const radius = (20 - h) * 0.4 * (0.9 + Math.random()*0.1); 
        const angle = Math.random() * Math.PI * 2;
        ornamentTarget[i*3] = Math.cos(angle)*radius; ornamentTarget[i*3+1] = h-10; ornamentTarget[i*3+2] = Math.sin(angle)*radius;
    }
    ornamentGeo.setAttribute('position', new THREE.BufferAttribute(ornamentPos, 3));
    ornamentGeo.setAttribute('color', new THREE.BufferAttribute(ornamentCols, 3));
    const ornamentParticles = new THREE.Points(ornamentGeo, new THREE.PointsMaterial({
        size: 0.28, vertexColors: true, blending: THREE.AdditiveBlending,
        depthWrite: false, transparent: true, opacity: 0.9 
    }));
    scene.add(ornamentParticles);

    // --- ⭐ 五角星 ---
    const starShape = new THREE.Shape();
    const outerRadius = 0.3; const innerRadius = 0.15; const points = 5; 
    for (let i = 0; i < points * 2; i++) {
        const radius = i % 2 === 0 ? outerRadius : innerRadius;
        const angle = (i / (points * 2)) * Math.PI * 2 + Math.PI / 2;
        const x = Math.cos(angle) * radius; const y = Math.sin(angle) * radius;
        if (i === 0) starShape.moveTo(x, y); else starShape.lineTo(x, y);
    }
    starShape.closePath();
    const starGeometry = new THREE.ExtrudeGeometry(starShape, { steps: 1, depth: 0.1, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.06, bevelSegments: 12 });
    starGeometry.center(); 
    
    const starCoreMat = new THREE.MeshBasicMaterial({ color: 0xfffff0, transparent: false });
    const starGroup = new THREE.Mesh(starGeometry, starCoreMat);
    
    const starGlowMat = new THREE.MeshBasicMaterial({ 
        color: 0xffff00, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false 
    });
    const starGlow = new THREE.Mesh(starGeometry, starGlowMat);
    starGlow.scale.set(1.15, 1.15, 1.15); 
    starGroup.add(starGlow);

    const starBasePosition = new THREE.Vector3(0, 10.5, 0);
    const starScatterVector = new THREE.Vector3((Math.random()-0.5)*30, Math.random()*30+20, (Math.random()-0.5)*30);
    starGroup.position.copy(starBasePosition);
    starGroup.scale.set(1.2, 1.2, 1.2);
    scene.add(starGroup);

    // 地面
    const gridHelper = new THREE.GridHelper(100, 40, 0x444444, 0x111111); 
    gridHelper.position.y = -10; 
    gridHelper.material.opacity = 0.2; gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // --- ❄️ 雪花系统 (修正版) ---
    const snowCount = isMobile ? 3500 : 1500;
    const snowGeo = new THREE.BufferGeometry();
    const snowPos = new Float32Array(snowCount * 3);
    const snowVelocity = new Float32Array(snowCount); 

    for (let i = 0; i < snowCount; i++) {
        snowPos[i * 3] = (Math.random() - 0.5) * 100;       
        snowPos[i * 3 + 1] = (Math.random() - 0.5) * 60;   
        snowPos[i * 3 + 2] = (Math.random() - 0.5) * 100; 
        snowVelocity[i] = 0.02 + Math.random() * 0.05;    
    }
    snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
    
    const snowSize = isMobile ? 0.03 : 0.12;
    const snowMaterial = new THREE.PointsMaterial({
        color: 0xffffff, size: snowSize, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false
    });
    const snowParticles = new THREE.Points(snowGeo, snowMaterial);
    scene.add(snowParticles);

    // --- 🎉 纸片礼花系统 (朋友版) ---
    const confettiGeo = new THREE.PlaneGeometry(0.4, 0.4); 
    const confettiMat = new THREE.MeshBasicMaterial({ color: 0xff0000, side: THREE.DoubleSide });
    const confetti = [];
    const confettiGroup = new THREE.Group();
    scene.add(confettiGroup);

    for(let i=0; i<50; i++) { 
         const mesh = new THREE.Mesh(confettiGeo, confettiMat);
         const h = Math.random() * 20;
         const radius = (20 - h) * 0.4 * Math.random();
         const angle = Math.random() * Math.PI * 2;
         const home = new THREE.Vector3(Math.cos(angle)*radius, h-10, Math.sin(angle)*radius);
         const target = new THREE.Vector3((Math.random()-0.5)*70, (Math.random()-0.5)*70, (Math.random()-0.5)*70);
         mesh.position.copy(home);
         mesh.scale.set(0,0,0); 
         mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
         confettiGroup.add(mesh);
         confetti.push({mesh, home, target, rotSpeedX: (Math.random()-0.5)*0.3, rotSpeedY: (Math.random()-0.5)*0.3, rotSpeedZ: (Math.random()-0.5)*0.3});
    }


    // --- 🎁 礼物系统 ---
    const gifts = []; 
    const giftGroup = new THREE.Group();
    scene.add(giftGroup);
    const boxColors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff]; 
    const giftCount = 12;
    const angleSlice = (Math.PI * 2) / giftCount;

    for(let i=0; i<giftCount; i++) {
        const w = 1.2 + Math.random() * 1.5; const h = 1.2 + Math.random() * 1.5; const d = 1.2 + Math.random() * 1.5; 
        const geometry = new THREE.BoxGeometry(w, h, d);
        const color = boxColors[Math.floor(Math.random() * boxColors.length)];

        const solidMaterial = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending, side: THREE.FrontSide });
        const solidBox = new THREE.Mesh(geometry, solidMaterial);
        const edges = new THREE.EdgesGeometry(geometry); 
        const lineMaterial = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.8, linewidth: 1 });
        const wireframe = new THREE.LineSegments(edges, lineMaterial);
        solidBox.add(wireframe); 

        const ribbonGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(-w/2, h/2, 0), new THREE.Vector3(w/2, h/2, 0), new THREE.Vector3(0, h/2, -d/2), new THREE.Vector3(0, h/2, d/2),
            new THREE.Vector3(-w/2, -h/2, 0), new THREE.Vector3(w/2, -h/2, 0), new THREE.Vector3(0, -h/2, -d/2), new THREE.Vector3(0, -h/2, d/2),
            new THREE.Vector3(-w/2, h/2, 0), new THREE.Vector3(-w/2, -h/2, 0), new THREE.Vector3(w/2, h/2, 0), new THREE.Vector3(w/2, -h/2, 0),
            new THREE.Vector3(0, h/2, d/2), new THREE.Vector3(0, -h/2, d/2), new THREE.Vector3(0, h/2, -d/2), new THREE.Vector3(0, -h/2, -d/2)
        ]);
        const ribbon = new THREE.LineSegments(ribbonGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 }));
        ribbon.scale.set(1.02, 1.02, 1.02); 
        solidBox.add(ribbon);

        const angle = i * angleSlice + (Math.random() - 0.5) * 0.5;
        const radius = 9 + Math.random() * 3;
        const homePos = new THREE.Vector3(Math.cos(angle)*radius, -10 + h/2, Math.sin(angle)*radius);
        const targetPos = new THREE.Vector3((Math.random()-0.5)*150, (Math.random()*40)-5, (Math.random()-0.5)*120);

        solidBox.position.copy(homePos);
        const initialYRot = Math.random() * Math.PI;
        solidBox.rotation.y = initialYRot;
        giftGroup.add(solidBox);

        if (i === 0) {
            const hatGroup = new THREE.Group();
            const coneGeo = new THREE.ConeGeometry(0.35, 0.7, 16);
            coneGeo.translate(0, 0.35, 0); 
            const coneMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const cone = new THREE.Mesh(coneGeo, coneMat);
            hatGroup.add(cone);
            const brimGeo = new THREE.TorusGeometry(0.35, 0.1, 16, 32);
            const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const brim = new THREE.Mesh(brimGeo, whiteMat);
            brim.rotation.x = Math.PI / 2;
            hatGroup.add(brim);
            const ballGeo = new THREE.SphereGeometry(0.12, 16, 16);
            const ball = new THREE.Mesh(ballGeo, whiteMat);
            ball.position.set(0, 0.7, 0);
            hatGroup.add(ball);
            hatGroup.position.y = h / 2;
            hatGroup.rotation.z = -0.2; 
            solidBox.add(hatGroup);
        }
        
        gifts.push({ 
            mesh: solidBox, home: homePos, target: targetPos, initialYRot: initialYRot,
            rotAxis: new THREE.Vector3(Math.random(), Math.random(), Math.random()).normalize(),
            rotSpeed: 0.005 + Math.random() * 0.01 
        });
    }

    // --- 🌠 流星系统 ---
    const meteorGroup = new THREE.Group();
    scene.add(meteorGroup);
    meteorGroup.visible = false; 

    const meteorHeadGeo = new THREE.SphereGeometry(1.2, 16, 16);
    const meteorMat = new THREE.MeshBasicMaterial({ color: 0xffffff, blending: THREE.AdditiveBlending });
    const meteorHead = new THREE.Mesh(meteorHeadGeo, meteorMat);
    meteorGroup.add(meteorHead);

    const meteorTailGeo = new THREE.CylinderGeometry(1.5, 0, 25, 16); 
    meteorTailGeo.rotateX(Math.PI / 2); 
    meteorTailGeo.translate(0, 0, -12.5); 
    const meteorTailMat = new THREE.MeshBasicMaterial({ color: 0xffffff, blending: THREE.AdditiveBlending, transparent: true, opacity: 0.4 });
    const meteorTail = new THREE.Mesh(meteorTailGeo, meteorTailMat);
    meteorGroup.add(meteorTail);

    let meteorActive = false;
    let lastMeteorLaunchTime = 0;
    const nextMeteorDelay = 5000; 
    const meteorStartPos = new THREE.Vector3();
    const meteorEndPos = new THREE.Vector3();
    const meteorDuration = 1000; 

    // --- 3. 交互 ---
    let gestureState = 'GATHER'; let explosionFactor = 0; 
    const videoElement = document.getElementById('input_video');
    const handStatus = document.getElementById('hand-status');
    const statusDot = document.getElementById('status-dot');
    const mainTitle = document.getElementById('main-title');
    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    hands.onResults(onResults);
    const cameraUtils = new Camera(videoElement, { onFrame: async () => { await hands.send({image: videoElement}); }, width: 320, height: 240 });
    cameraUtils.start();

    function onResults(results) {
        document.getElementById('loading').style.display = 'none';
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const landmarks = results.multiHandLandmarks[0]; const wrist = landmarks[0];
            const tips = [8, 12, 16, 20]; const mcps = [5, 9, 13, 17]; let foldedFingers = 0;
            function dist(p1, p2) { return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2)); }
            for(let i=0; i<4; i++) { if (dist(landmarks[tips[i]], wrist) < dist(landmarks[mcps[i]], wrist) * 1.6) foldedFingers++; }
            if (foldedFingers >= 3) { gestureState = 'GATHER'; statusDot.classList.add('active'); statusDot.classList.remove('scatter'); handStatus.innerText = "状态: ✊ 聚合"; handStatus.style.color = "#00ff00"; mainTitle.classList.remove('visible'); } 
            else { gestureState = 'SCATTER'; statusDot.classList.add('scatter'); statusDot.classList.remove('active'); handStatus.innerText = "状态: 🖐 悬浮"; handStatus.style.color = "#ff4d4d"; mainTitle.classList.add('visible'); }
        } else { gestureState = 'GATHER'; statusDot.classList.remove('active', 'scatter'); handStatus.innerText = "默认状态"; handStatus.style.color = "#d4af37"; mainTitle.classList.remove('visible'); }
    }

    // --- 4. 动画 ---
    let time = 0;
    function updateParticles(geometry, count, currentPos, targetPos, randomPos, factor, timeOffset) {
        for (let i = 0; i < count; i++) {
            const ix = i * 3; const iy = i * 3 + 1; const iz = i * 3 + 2;
            const finalX = targetPos[ix] + (randomPos[ix] * factor);
            const finalY = targetPos[iy] + (randomPos[iy] * factor);
            const finalZ = targetPos[iz] + (randomPos[iz] * factor);
            currentPos[ix] += (finalX - currentPos[ix]) * 0.08;
            currentPos[iy] += (finalY - currentPos[iy]) * 0.08;
            currentPos[iz] += (finalZ - currentPos[iz]) * 0.08;
            if (factor < 0.1) currentPos[iy] += Math.sin(time + ix * timeOffset) * 0.02;
        }
        geometry.attributes.position.needsUpdate = true;
    }

    function animate() {
        requestAnimationFrame(animate);
        const now = Date.now();
        time += 0.01;
        const slowRot = time * 0.1;
        foliageParticles.rotation.y = slowRot; ornamentParticles.rotation.y = slowRot; starGroup.rotation.y = slowRot;
        
        const snowP = snowParticles.geometry.attributes.position.array;
        for(let i=0; i<snowCount; i++) {
            snowP[i*3+1] -= snowVelocity[i];
            snowP[i*3] += Math.sin(time + i) * 0.02; 
            if (snowP[i*3+1] < -20) {
                snowP[i*3+1] = 30; 
                snowP[i*3] = (Math.random() - 0.5) * 100; 
                snowP[i*3+2] = (Math.random() - 0.5) * 100; 
            }
        }
        snowParticles.geometry.attributes.position.needsUpdate = true;

        if (!meteorActive && now - lastMeteorLaunchTime > nextMeteorDelay) {
            meteorActive = true;
            lastMeteorLaunchTime = now;
            const startX = -(400 + Math.random() * 100); 
            const startY = 150 + Math.random() * 100;    
            const startZ = -(250 + Math.random() * 150); 
            meteorStartPos.set(startX, startY, startZ);
            const endX = (400 + Math.random() * 100);
            const endY = 50 + Math.random() * 50;      
            const endZ = startZ + (Math.random() - 0.5) * 50; 
            meteorEndPos.set(endX, endY, endZ);
            meteorGroup.position.copy(meteorStartPos);
            meteorGroup.lookAt(meteorEndPos); 
            meteorGroup.visible = true;
        }

        if (meteorActive) {
            const elapsed = now - lastMeteorLaunchTime;
            const progress = elapsed / meteorDuration;
            if (progress < 1) {
                meteorGroup.position.lerpVectors(meteorStartPos, meteorEndPos, progress);
            } else {
                meteorActive = false;
                meteorGroup.visible = false;
            }
        }

        let targetFactor = (gestureState === 'SCATTER') ? 1 : 0;
        explosionFactor += (targetFactor - explosionFactor) * 0.05;

        updateParticles(foliageGeo, foliageCount, foliagePos, foliageTarget, foliageRandom, explosionFactor, 0.01);
        updateParticles(ornamentGeo, ornamentCount, ornamentPos, ornamentTarget, ornamentRandom, explosionFactor, 0.02);

        const starCurrentTarget = starBasePosition.clone().lerp(starBasePosition.clone().add(starScatterVector), explosionFactor);
        starGroup.position.lerp(starCurrentTarget, 0.08);
        const currentScale = 1.2 * (1 - explosionFactor * 0.3); 
        starGroup.scale.set(currentScale, currentScale, currentScale);

        confetti.forEach(item => {
            item.mesh.position.lerpVectors(item.home, item.target, explosionFactor);
            const s = explosionFactor * 1.0; 
            item.mesh.scale.set(s, s, s);
            if (explosionFactor > 0.01) {
                item.mesh.rotation.x += item.rotSpeedX;
                item.mesh.rotation.y += item.rotSpeedY;
                item.mesh.rotation.z += item.rotSpeedZ;
            }
        });

        giftGroup.rotation.y = (explosionFactor < 0.5) ? slowRot : giftGroup.rotation.y;
        gifts.forEach(gift => {
            gift.mesh.position.lerpVectors(gift.home, gift.target, explosionFactor);
            if (explosionFactor > 0.1) {
                gift.mesh.rotateOnAxis(gift.rotAxis, gift.rotSpeed);
            } else {
                gift.mesh.rotation.x = 0;
                gift.mesh.rotation.z = 0;
                gift.mesh.rotation.y = gift.initialYRot;
            }
        });

        renderer.render(scene, camera);
    }

    let mouseX = 0; let mouseY = 0;
    document.addEventListener('mousemove', (e) => { mouseX = (e.clientX - window.innerWidth / 2) * 0.01; mouseY = (e.clientY - window.innerHeight / 2) * 0.01; camera.position.x += (mouseX - camera.position.x) * 0.05; camera.position.y += (-mouseY * 5 - camera.position.y) * 0.05; camera.lookAt(0, 0, 0); });
    window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    animate();
</script>
</body>
</html>
